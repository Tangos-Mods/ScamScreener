# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=true

# Keep Stonecutter targets and publish fan-out in sync.
minecraft.versions=26.1.2,26.2,26.3-rc-2

# Mod properties. Options: STABLE, BETA, ALPHA
mod.version=2.6.1
mod.type=STABLE
mod.group=eu.tango
mod.id=scamscreener
mod.name=ScamScreener

# Global dependencies
deps.fabric_loader=0.19.3
deps.fabric_api=0.160.4+26.3
deps.modmenu_version=21.0.0-beta.1

# Minecraft target metadata for the 26.3 build (currently the release candidate; ~26.3- also accepts the final release).
# mod.mc_targets feeds Modrinth, mod.cf_targets CurseForge (which files 26.x pre-releases under "26.1-snapshot").
mod.mc_dep=~26.3-
mod.mc_title=26.3-rc-2
mod.mc_targets=26.3-rc-2
mod.cf_targets=26.1-snapshot

publish.modrinth=XTB0bgAW
publish.curseforge=1465941
